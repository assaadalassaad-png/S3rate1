function updateReportsUI() {
let filter = document.getElementById('report-filter').value;
let fInc = 0, fExp = 0;

let filteredList = transactionsLog.filter(tx => {
if(filter === 'day') {
let dVal = document.getElementById('sel-date')?.value;
return tx.day === dVal;
} else if(filter === 'month') {
let mVal = document.getElementById('sel-month')?.value;
let yVal = document.getElementById('sel-month-year')?.value;
return tx.month === mVal && tx.year === yVal;
} else if(filter === 'year') {
let yVal = document.getElementById('sel-year')?.value;
return tx.year === yVal;
}
return true;
});

filteredList.forEach(tx => {
if(tx.type === 'in') fInc += tx.val;
else fExp += tx.val;
});

document.getElementById('rep-inc').innerText = fInc.toLocaleString() + ' سعرة';
document.getElementById('rep-exp').innerText = fExp.toLocaleString() + ' سعرة';
let net = fInc - fExp;
document.getElementById('rep-net').innerText = net.toLocaleString() + ' سعرة';

let filteredWeights = weightLog.filter(w => {
if(filter === 'day') {
let dVal = document.getElementById('sel-date')?.value;
return w.date === dVal;
} else if(filter === 'month') {
let mVal = document.getElementById('sel-month')?.value;
let yVal = document.getElementById('sel-month-year')?.value;
return w.month === mVal && w.year === yVal;
} else if(filter === 'year') {
let yVal = document.getElementById('sel-year')?.value;
return w.year === yVal;
}
return true;
});

let wtDiffText = "0 كغ";
if(filteredWeights.length >= 2) {
let firstW = filteredWeights[0].weight;
let lastW = filteredWeights[filteredWeights.length - 1].weight;
let diff = lastW - firstW;
wtDiffText = (diff > 0 ? "+" : "") + diff.toFixed(1) + " كغ";
} else if(filteredWeights.length === 1) {
wtDiffText = filteredWeights[0].weight + " كغ (ثابت)";
}
document.getElementById('rep-wt-diff').innerText = wtDiffText;

let maxVal = Math.max(fInc, fExp, 1);
let incPct = Math.round((fInc / maxVal) * 100);
let expPct = Math.round((fExp / maxVal) * 100);

document.getElementById('chart-inc-lbl').innerText = fInc.toLocaleString() + ' سعرة (' + incPct + '%)';
document.getElementById('chart-inc-fill').style.width = incPct + '%';

document.getElementById('chart-exp-lbl').innerText = fExp.toLocaleString() + ' سعرة (' + expPct + '%)';
document.getElementById('chart-exp-fill').style.width = expPct + '%';
}

function renderFoodList(list) {
let lst = document.getElementById('f-list');
if(!lst) return;
lst.innerHTML = '';
list.forEach((item, index) => {
let originalIdx = foodsDB.indexOf(item);
let d = document.createElement('div');
d.className = 'food-item';
d.innerHTML = <span&gt;&lt;b&gt;${item.name}</b> (${item.cal} سعرة | بروتين: ${item.p || 0}غ)</span>; d.onclick = function() { selFoodIdx = originalIdx; document.getElementById('srch-food').value = item.name; lst.innerHTML =<div style="color:var(--green-in); font-weight:bold; padding:4px;">تم اختيار: ${item.name}&lt;/div>;
};
lst.appendChild(d);
});
}

function filterFoodList() {
let q = document.getElementById('srch-food').value.toLowerCase();
renderFoodList(foodsDB.filter(x => x.name.toLowerCase().includes(q)));
}

function renderActivityList(list) {
let lst = document.getElementById('act-list');
if(!lst) return;
lst.innerHTML = '';
list.forEach((item, index) => {
let originalIdx = activitiesDB.indexOf(item);
let d = document.createElement('div');
d.className = 'food-item';
d.innerHTML = <span&gt;&lt;b&gt;${item.name}</b> (${item.rate} سعرة / دقيقة)&lt;/span>;
d.onclick = function() {
selActIdx = originalIdx;
document.getElementById('srch-act').value = item.name;
lst.innerHTML = <div style="color:var(--red-out); font-weight:bold; padding:4px;"&gt;تم اختيار النشاط: ${item.name}&lt;/div>;
};
lst.appendChild(d);
});
}

function filterActivityList() {
let q = document.getElementById('srch-act').value.toLowerCase();
renderActivityList(activitiesDB.filter(x => x.name.toLowerCase().includes(q)));
}

