function getDateTimeData() {
let now = new Date();
return {
dateStr: now.toLocaleDateString('en-CA'),
timeStr: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
year: now.getFullYear().toString(),
month: (now.getMonth() + 1).toString().padStart(2, '0'),
day: now.getDate().toString().padStart(2, '0')
};
}

function submitNewFoodItem() {
let name = document.getElementById('new-f-name').value.trim();
let cal = parseFloat(document.getElementById('new-f-cal').value);
let p = parseFloat(document.getElementById('new-f-p').value) || 0;
let c = parseFloat(document.getElementById('new-f-c').value) || 0;
let f = parseFloat(document.getElementById('new-f-f').value) || 0;

if(!name || isNaN(cal)) {
alert('الرجاء إدخال اسم الصنف والسعرات بشكل صحيح');
return;
}

foodsDB.unshift({ name: name, cal: cal, p: p, c: c, f: f });
alert(تم إضافة "${name}" بنجاح!`);
openActionForm('income');
}

function submitNewActivityItem() {
let name = document.getElementById('new-act-name').value.trim();
let rate = parseFloat(document.getElementById('new-act-rate').value);

if(!name || isNaN(rate)) {
alert('الرجاء إدخال اسم النشاط ومعدل الحرق بالدقيقة بشكل صحيح');
return;
}

activitiesDB.unshift({ name: name, rate: rate });
alert(تم إضافة النشاط "${name}" بنجاح!`);
openActionForm('expense');
}

function editSelectedFood() {
let item = foodsDB[selFoodIdx];
if(!item) return alert('الرجاء اختيار صنف أولاً من القائمة');
let newName = prompt("تعديل اسم الصنف:", item.name);
let newCal = prompt("تعديل السعرات لكل 100غ:", item.cal);
let newP = prompt("تعديل البروتين لكل 100غ:", item.p || 0);
if(newName !== null && newCal !== null) {
item.name = newName.trim();
item.cal = parseFloat(newCal) || item.cal;
if(newP !== null) item.p = parseFloat(newP) || 0;
alert("تم تعديل الصنف بنجاح!");
renderFoodList(foodsDB);
}
}

function deleteSelectedFood() {
let item = foodsDB[selFoodIdx];
if(!item) return alert('الرجاء اختيار صنف أولاً من القائمة');
if(confirm(هل أنت متأكد من حذف "${item.name}" من القائمة؟`)) {
foodsDB.splice(selFoodIdx, 1);
selFoodIdx = 0;
alert("تم حذف الصنف بنجاح!");
renderFoodList(foodsDB);
}
}

function submitFoodIncome() {
let g = parseFloat(document.getElementById('eat-g').value);
if(!g || g <= 0) return alert('أدخل الكمية بالغرام');
let item = foodsDB[selFoodIdx] || foodsDB[0];

let cal = (g / 100) * (item.cal || 0);
curP += (g / 100) * (item.p || 0);
curC += (g / 100) * (item.c || 0);
curF += (g / 100) * (item.f || 0);

currentCal += cal;
totalInc += cal;

let dt = getDateTimeData();
transactionsLog.push({
id: Date.now(), type: 'in', name: مدخول: ${item.name} (${g}غ), val: cal,
datetime: ${dt.dateStr} • ${dt.timeStr}, year: dt.year, month: dt.month, day: dt.dateStr, cat: 'تغذية'
});

updateCalUI();
closeForm();
}

function submitActivityExpense() {
let mins = parseFloat(document.getElementById('exp-mins').value);
if(!mins || mins <= 0) return alert('أدخل الدقائق');
let act = activitiesDB[selActIdx] || activitiesDB[0];

let burned = mins * act.rate;
let title = ${act.name} (${mins}د);

currentCal -= burned;
totalExp += burned;

let dt = getDateTimeData();
transactionsLog.push({
id: Date.now(), type: 'out', name: مصروف: ${title}, val: burned, datetime: ``${dt.dateStr} • ${dt.timeStr}`, year: dt.year, month: dt.month, day: dt.dateStr, cat: 'رياضة'
});

updateCalUI();
closeForm();
}

function submitManualBalance() {
let v = parseFloat(document.getElementById('man-bal').value);
if(!isNaN(v)) { currentCal = v; updateCalUI(); closeForm(); }
}

function editTransaction(id) {
let tx = transactionsLog.find(x => x.id === id);
if(!tx) return;
let newVal = prompt("أدخل القيمة الجديدة للسعرات:", tx.val);
if(newVal !== null) {
let num = parseFloat(newVal);
if(!isNaN(num)) {
if(tx.type === 'in') {
currentCal += (num - tx.val);
totalInc += (num - tx.val);
} else {
currentCal -= (num - tx.val);
totalExp += (num - tx.val);
}
tx.val = num;
updateCalUI();
renderTransactions();
}
}
}

function deleteTransaction(id) {
let idx = transactionsLog.findIndex(x => x.id === id);
if(idx !== -1) {
let tx = transactionsLog[idx];
if(tx.type === 'in') { currentCal -= tx.val; totalInc -= tx.val; }
else { currentCal += tx.val; totalExp -= tx.val; }
transactionsLog.splice(idx, 1);
updateCalUI();
renderTransactions();
}
}

function editWeightLog(id) {
let item = weightLog.find(x => x.id === id);
if(!item) return;
let newW = prompt("أدخل الوزن الجديد (كغ):", item.weight);
if(newW !== null) {
let wNum = parseFloat(newW);
if(!isNaN(wNum) && wNum > 0) {
item.weight = wNum;
recalculateWeightLog();
renderWeightLogTable();
currentWeight = weightLog[weightLog.length - 1].weight;
document.getElementById('wt-current').innerText = currentWeight;
calcWeightFormulas();
}
}
}

function deleteWeightLog(id) {
let idx = weightLog.findIndex(x => x.id === id);
if(idx !== -1) {
weightLog.splice(idx, 1);
recalculateWeightLog();
renderWeightLogTable();
if(weightLog.length > 0) {
currentWeight = weightLog[weightLog.length - 1].weight;
} else {
currentWeight = 140.0;
}
document.getElementById('wt-current').innerText = currentWeight;
calcWeightFormulas();
}
}

function recalculateWeightLog() {
let prevW = 140.0;
let cumDiff = 0;
weightLog.forEach((item, index) => {
if(index === 0) {
item.diff = 0;
item.totalDiff = item.weight - 140.0;
} else {
item.diff = item.weight - prevW;
cumDiff += item.diff;
item.totalDiff = cumDiff;
}
prevW = item.weight;
});
}

function updateCalUI() {
document.getElementById('main-cal-val').innerText = currentCal.toLocaleString();
document.getElementById('total-inc').innerText = totalInc.toLocaleString();
document.getElementById('total-exp').innerText = totalExp.toLocaleString();

let surplusVal = 1500 - totalInc;
document.getElementById('surplus-val').innerHTML = surplusVal.toLocaleString() + ' <span style="font-size:14px;">سعرة</span>';

document.getElementById('m-p').innerText = curP.toFixed(1) + ' غ';
document.getElementById('m-c').innerText = curC.toFixed(1) + ' غ';
document.getElementById('m-f').innerText = curF.toFixed(1) + ' غ';

let remP = targetP - curP;
let remC = targetC - curC;
let remF = targetF - curF;

document.getElementById('m-p-rem').innerText = (remP > 0 ? remP.toFixed(1) : 0) + ' غ';
document.getElementById('m-c-rem').innerText = (remC > 0 ? remC.toFixed(1) : 0) + ' غ';
document.getElementById('m-f-rem').innerText = (remF > 0 ? remF.toFixed(1) : 0) + ' غ';
}

function renderTransactions() {
let container = document.getElementById('transactions-list-container');
if(transactionsLog.length === 0) {
container.innerHTML = <div style="text-align: center; color: var(--text-sub); padding: 30px; font-size: 13px; background:white; border-radius:14px;"&gt;لا توجد عمليات مسجلة حتى الآن&lt;/div>;
return;
}
container.innerHTML = '';
transactionsLog.forEach(tx => {
let card = document.createElement('div');
card.className = 'tx-card';
let color = tx.type === 'in' ? 'var(--green-in)' : 'var(--red-out)';
let sign = tx.type === 'in' ? '+' : '-';
card.innerHTML = &lt;div class="tx-info"&gt; &lt;h4&gt;${tx.name}</h4>
<p>{tx.cat}</p>
</div>
<div class="tx-amount-side">
<div class="tx-amount" style="color:{sign} {tx.id})">تعديل</button>
<button class="btn-action-sm btn-delete" onclick="deleteTransaction(${tx.id})"&gt;حذف&lt;/button&gt; &lt;/div&gt; &lt;/div&gt;;
container.appendChild(card);
});
}

function updateWeightData() {
let w = parseFloat(document.getElementById('wt-input-new').value);
if(!isNaN(w) && w > 0) {
currentWeight = w;
document.getElementById('wt-current').innerText = currentWeight;

let dt = getDateTimeData();
let lastWeight = weightLog.length > 0 ? weightLog[weightLog.length - 1].weight : 140.0;
let diff = w - lastWeight;
let totalDiff = (weightLog.length > 0 ? weightLog[weightLog.length - 1].totalDiff : 0) + diff;

weightLog.push({
id: Date.now(),
date: dt.dateStr,
weight: w,
diff: diff,
totalDiff: totalDiff,
year: dt.year,
month: dt.month
});

renderWeightLogTable();
calcWeightFormulas();
document.getElementById('wt-input-new').value = '';
}
}

function renderWeightLogTable() {
let tbody = document.getElementById('weight-log-tbody');
if(weightLog.length === 0) {
tbody.innerHTML = <tr&gt;&lt;td colspan="5" style="color:var(--text-sub);"&gt;لا يوجد سجلات وزن بعد&lt;/td&gt;&lt;/tr>;
return;
}
tbody.innerHTML = '';
weightLog.forEach(item => {
let tr = document.createElement('tr');
let diffSign = item.diff > 0 ? '+' : '';
let totSign = item.totalDiff > 0 ? '+' : '';
tr.innerHTML = &lt;td&gt;${item.date}</td>
<td><b>{item.diff > 0 ? 'var(--red-out)' : 'var(--green-in)'};">{item.diff.toFixed(1)}</td>
<td style="color:{totSign}{item.id})">تعديل</button>
<button class="btn-action-sm btn-delete" onclick="deleteWeightLog(${item.id})"&gt;حذف&lt;/button&gt; &lt;/td&gt;;
tbody.appendChild(tr);
});
}

function calcWeightFormulas() {
let target = parseFloat(document.getElementById('wt-target').value) || 90;
let age = parseFloat(document.getElementById('wt-age').value) || 25;
let height = parseFloat(document.getElementById('wt-height').value) || 170;
let act = parseFloat(document.getElementById('wt-activity').value) || 1.55;

let hm = height / 100;
let bmi = currentWeight / (hm * hm);
document.getElementById('res-bmi').innerText = bmi.toFixed(1);

let bmr = (10 * currentWeight) + (6.25 * height) - (5 * age) + 5;
document.getElementById('res-bmr').innerText = bmr.toFixed(0) + ' سعرة';

let tdee = bmr * act;
document.getElementById('res-tdee').innerText = tdee.toFixed(0) + ' سعرة';

let diffWeight = Math.abs(currentWeight - target);
let totCal = diffWeight * 7700;
document.getElementById('res-tot-cal').innerText = totCal.toLocaleString() + ' سعرة';

let weeks = diffWeight / 1.5;
document.getElementById('res-weeks').innerText = weeks.toFixed(1) + ' أسبوع';
}

