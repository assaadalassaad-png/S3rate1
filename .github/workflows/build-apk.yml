function switchMainPage(page) {
document.getElementById('page-calories').classList.remove('active');
document.getElementById('page-transactions').classList.remove('active');
document.getElementById('page-weight').classList.remove('active');
document.getElementById('page-reports').classList.remove('active');
document.getElementById('btn-switch-cal').classList.remove('active');
document.getElementById('btn-switch-wt').classList.remove('active');

if(page === 'cal') {
document.getElementById('page-calories').classList.add('active');
document.getElementById('btn-switch-cal').classList.add('active');
} else if(page === 'txs') {
document.getElementById('page-transactions').classList.add('active');
renderTransactions();
} else if(page === 'wt') {
document.getElementById('page-weight').classList.add('active');
document.getElementById('btn-switch-wt').classList.add('active');
calcWeightFormulas();
} else if(page === 'rep') {
document.getElementById('page-reports').classList.add('active');
onReportFilterChange();
}
}

