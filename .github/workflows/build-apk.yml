<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق السعرات - شام كاش</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
--bg-color: #f0f4f9;
--card-bg: #ffffff;
--primary-blue: #2563eb;
--text-main: #1e293b;
--text-sub: #64748b;
--green-in: #10b981;
--red-out: #ef4444;
--orange-btn: #f59e0b;
--purple-reports: #8b5cf6;
--radius-lg: 20px;
--radius-md: 14px;
}

* { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 0; user-select: none; }
body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding-bottom: 95px; }

.app-screen { width: 100%; max-width: 430px; padding: 12px; position: relative; }

.top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.icon-btn { width: 40px; height: 40px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; color: var(--text-main); font-size: 16px; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }

.toggle-pill { display: flex; background: #e2e8f0; border-radius: 25px; padding: 3px; width: 180px; }
.toggle-opt { flex: 1; text-align: center; padding: 6px 0; font-size: 14px; font-weight: 700; border-radius: 20px; cursor: pointer; color: var(--text-sub); border: none; background: transparent; }
.toggle-opt.active { background: var(--primary-blue); color: white; box-shadow: 0 2px 6px rgba(37,99,235,0.2); }

.page-view { display: none; }
.page-view.active { display: block; animation: fadeIn 0.2s ease-in-out; }

.card { background: var(--card-bg); border-radius: var(--radius-lg); padding: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); margin-bottom: 12px; }
.card-title { font-size: 13px; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
.card-value { font-size: 32px; font-weight: 800; color: var(--text-main); }

.action-row { display: flex; gap: 8px; margin-bottom: 12px; }
.action-btn-card { flex: 1; background: var(--card-bg); border-radius: var(--radius-md); padding: 12px 6px; border: none; font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
.action-btn-card.in { color: var(--green-in); }
.action-btn-card.out { color: var(--red-out); }
.action-btn-card.surplus { color: var(--orange-btn); background: #fffbeb; border: 1px solid #fde68a; }

.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; text-align: center; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; text-align: center; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; text-align: center; }

.box-item { background: var(--card-bg); border-radius: var(--radius-md); padding: 10px 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
.box-title { font-size: 11px; color: var(--text-sub); font-weight: 600; margin-bottom: 4px; }
.box-val { font-size: 14px; font-weight: 800; }

.cat-box { background: var(--card-bg); border-radius: var(--radius-md); padding: 12px 6px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.02); cursor: pointer; }
.cat-circle { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; margin-bottom: 6px; }
.cat-title { font-size: 11px; font-weight: 700; color: var(--text-main); }

.input-box { margin-bottom: 10px; }
.input-box label { display: block; font-size: 11px; color: var(--text-sub); margin-bottom: 4px; font-weight: 600; }
.input-box input, .input-box select { width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 10px; background: #f8fafc; font-size: 13px; outline: none; }
.btn-main { width: 100%; padding: 11px; background: var(--primary-blue); color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; margin-top: 4px; }

.btn-action-sm { border: none; padding: 6px 10px; border-radius: 8px; font-weight: 700; font-size: 11px; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; gap: 4px; }
.btn-warning-custom { background: var(--orange-btn); }
.btn-danger-custom { background: var(--red-out); }

.btn-add-inline { background: #eff6ff; color: var(--primary-blue); border: 1px dashed var(--primary-blue); width: 100%; padding: 8px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.btn-add-inline.red { background: #fef2f2; color: var(--red-out); border-color: var(--red-out); }

.btn-edit { background: #fef3c7; color: #b45309; }
.btn-delete { background: #fee2e2; color: #b91c1c; }

.food-list { max-height: 150px; overflow-y: auto; background: #f8fafc; border-radius: 8px; padding: 6px; border: 1px solid #e2e8f0; margin-bottom: 8px; }
.food-item { padding: 6px; border-bottom: 1px solid #e2e8f0; font-size: 12px; display: flex; justify-content: space-between; cursor: pointer; }
.food-item:hover { background: #e2e8f0; }

.modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 15px; }
.modal-overlay.active { display: flex; }
.modal-content { background: white; border-radius: var(--radius-lg); width: 100%; max-width: 410px; padding: 18px; position: relative; max-height: 90vh; overflow-y: auto; animation: fadeIn 0.2s; }

.tx-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.btn-new-tx { background: #eff6ff; color: var(--primary-blue); border: 1px solid #bfdbfe; padding: 8px 14px; border-radius: 20px; font-weight: 700; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.tx-card { background: white; border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); display: flex; justify-content: space-between; align-items: center; }
.tx-info h4 { font-size: 14px; font-weight: 700; color: var(--text-main); margin-bottom: 2px; }
.tx-info p { font-size: 11px; color: var(--text-sub); }
.tx-amount-side { text-align: left; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.tx-amount { font-size: 15px; font-weight: 800; }
.tx-actions-row { display: flex; gap: 4px; }

.weight-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; text-align: center; }
.weight-table th { background: #f8fafc; color: var(--text-sub); padding: 8px; border-bottom: 1px solid #e2e8f0; }
.weight-table td { padding: 8px; border-bottom: 1px solid #e2e8f0; }

.chart-container { margin-top: 12px; }
.chart-bar-wrap { margin-bottom: 8px; }
.chart-label { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; margin-bottom: 3px; color: var(--text-sub); }
.chart-track { background: #e2e8f0; border-radius: 10px; height: 10px; width: 100%; overflow: hidden; }
.chart-fill { height: 100%; border-radius: 10px; transition: width 0.4s ease; }

.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; height: 75px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #e2e8f0; max-width: 430px; margin: 0 auto; padding: 0 6px; z-index: 100; border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -4px 15px rgba(0,0,0,0.04); }
.nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 4px; border-radius: 12px; color: white; font-size: 10px; font-weight: 700; gap: 3px; cursor: pointer; border: none; width: 52px; height: 50px; }
.nav-btn.debts { background: var(--orange-btn); }
.nav-btn.exp { background: var(--red-out); }
.nav-btn.inc { background: var(--green-in); }
.nav-btn.txs { background: #0891b2; }
.nav-btn.rep { background: var(--purple-reports); }
.nav-btn.hom { background: var(--primary-blue); }
.nav-btn i { font-size: 14px; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="app-screen">

<div class="top-header">
<button class="icon-btn" onclick="switchMainPage('rep')"><i class="fa-solid fa-chart-pie"></i></button>
<div class="toggle-pill">
<button class="toggle-opt active" id="btn-switch-cal" onclick="switchMainPage('cal')">السعرات</button>
<button class="toggle-opt" id="btn-switch-wt" onclick="switchMainPage('wt')">الوزن</button>
</div>
<button class="icon-btn" style="color:var(--orange-btn);" onclick="switchMainPage('txs')"><i class="fa-solid fa-list-check"></i></button>
</div>

<!-- PAGE 1: CALORIES -->
<div class="page-view active" id="page-calories">

<div class="card" style="text-align: center;">
<div class="card-title" style="justify-content: center;"><span>رصيد السعرات المستهدف للتصفير</span> <i class="fa-regular fa-eye"></i></div>
<div class="card-value"><span id="main-cal-val">77,500</span> <span style="font-size:16px;">سعرة</span></div>
<div style="font-size: 11px; color: var(--text-sub); margin-top: 4px;">المدخول يرفع الرصيد • المصروف والاحتياج يخفضانه</div>
</div>

<!-- Surplus Card -->
<div class="card" style="background:#fefce8; border:1px solid #fde047; text-align:center;">
<div class="card-title" style="justify-content: center; color:#854d0e;"><i class="fa-solid fa-bolt"></i> بطاقة الفائض (أقل من الاحتياج 1500)</div>
<div class="card-value" style="color:#a16207; font-size:26px;" id="surplus-val">1,500 <span style="font-size:14px;">سعرة</span></div>
<div style="font-size: 10px; color: #a16207; margin-top:2px;">= 1500 ناقص المدخول الحالي (مؤشر مستقل لا يؤثر بالحسابات)</div>
</div>

<div class="action-row">
<button class="action-btn-card in" onclick="openActionForm('income')"><i class="fa-solid fa-caret-up"></i> مدخول (أكل)</button>
<button class="action-btn-card out" onclick="openActionForm('expense')"><i class="fa-solid fa-caret-down"></i> مصروف (رياضة)</button>
<button class="action-btn-card surplus" onclick="openActionForm('surplus_details')"><i class="fa-solid fa-bolt"></i> فائض</button>
</div>

<!-- Macros Total Row -->
<div class="grid-3" style="margin-bottom:4px;">
<div class="box-item"><div class="box-title">بروتين</div><div class="box-val" style="color:var(--primary-blue);" id="m-p">0.0 غ</div></div>
<div class="box-item"><div class="box-title">كربوهيدرات</div><div class="box-val" style="color:var(--orange-btn);" id="m-c">0.0 غ</div></div>
<div class="box-item"><div class="box-title">دهون</div><div class="box-val" style="color:var(--red-out);" id="m-f">0.0 غ</div></div>
</div>

<!-- Macros Remaining Row -->
<div class="grid-3">
<div class="box-item" style="background:#eff6ff; border:1px solid #bfdbfe;">
<div class="box-title" style="color:#1d4ed8;">متبقي البروتين</div>
<div class="box-val" style="color:#1e40af;" id="m-p-rem">166.0 غ</div>
</div>
<div class="box-item" style="background:#fffbeb; border:1px solid #fde68a;">
<div class="box-title" style="color:#b45309;">متبقي الكربو</div>
<div class="box-val" style="color:#92400e;" id="m-c-rem">200.0 غ</div>
</div>
<div class="box-item" style="background:#fef2f2; border:1px solid #fecaca;">
<div class="box-title" style="color:#b91c1c;">متبقي الدهون</div>
<div class="box-val" style="color:#991b1b;" id="m-f-rem">60.0 غ</div>
</div>
</div>

<div class="grid-2">
<div class="box-item">
<div class="box-title" style="color:var(--green-in);"><i class="fa-solid fa-circle-arrow-up"></i> إجمالي المدخول (أكل)</div>
<div class="box-val" style="color:var(--green-in);" id="total-inc">0</div>
</div>
<div class="box-item">
<div class="box-title" style="color:var(--red-out);"><i class="fa-solid fa-circle-arrow-down"></i> إجمالي المصروف (رياضة)</div>
<div class="box-val" style="color:var(--red-out);" id="total-exp">0</div>
</div>
</div>

<div class="grid-4">
<div class="cat-box" onclick="openActionForm('add_food')">
<div class="cat-circle" style="background:var(--primary-blue);"><i class="fa-solid fa-plus-circle"></i></div>
<div class="cat-title">إضافة طعام</div>
</div>
<div class="cat-box" onclick="openActionForm('balance')">
<div class="cat-circle" style="background:var(--orange-btn);"><i class="fa-solid fa-pen-to-square"></i></div>
<div class="cat-title">تعديل رصيد</div>
</div>
<div class="cat-box" onclick="openActionForm('income')">
<div class="cat-circle" style="background:var(--green-in);"><i class="fa-solid fa-utensils"></i></div>
<div class="cat-title">إضافة أكل</div>
</div>
<div class="cat-box" onclick="openActionForm('expense')">
<div class="cat-circle" style="background:var(--red-out);"><i class="fa-solid fa-person-biking"></i></div>
<div class="cat-title">إضافة رياضة</div>
</div>
</div>

</div>

<!-- PAGE 2: TRANSACTIONS -->
<div class="page-view" id="page-transactions">
<div class="tx-header-row">
<div style="font-weight: 800; font-size: 15px; display:flex; align-items:center; gap:6px;">
<i class="fa-solid fa-receipt" style="color:var(--primary-blue);"></i> سجل العمليات بالتاريخ والساعة
</div>
<button class="btn-new-tx" onclick="openActionForm('income')"><i class="fa-solid fa-plus"></i> جديد</button>
</div>

<div id="transactions-list-container">
<div style="text-align: center; color: var(--text-sub); padding: 30px; font-size: 13px; background:white; border-radius:14px;">لا توجد عمليات مسجلة حتى الآن</div>
</div>
</div>

<!-- PAGE 3: WEIGHT -->
<div class="page-view" id="page-weight">
<div class="card" style="text-align: center;">
<div class="card-title" style="justify-content: center;">وزنك الحالي (رصيد الوزن)</div>
<div class="card-value"><span id="wt-current">140.0</span> <span style="font-size:16px;">كغ</span></div>
<div style="margin-top:10px;">
<input type="number" id="wt-input-new" placeholder="أدخل وزنك اليومي" style="padding:8px; width:65%; border-radius:8px; border:1px solid #cbd5e1;">
<button onclick="updateWeightData()" style="padding:8px 12px; background:var(--primary-blue); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">تحديث الوزن</button>
</div>
</div>

<div class="card">
<div class="card-title"><span>سجل الوزن اليومي والمقارنات</span></div>
<div style="max-height: 180px; overflow-y: auto;">
<table class="weight-table">
<thead>
<tr>
<th>التاريخ</th>
<th>الوزن</th>
<th>الفرق</th>
<th>المجموع</th>
<th>تحكم</th>
</tr>
</thead>
<tbody id="weight-log-tbody">
<tr><td colspan="5" style="color:var(--text-sub);">لا يوجد سجلات وزن بعد</td></tr>
</tbody>
</table>
</div>
</div>

<div class="card">
<div class="card-title"><span>إعدادات وهدف الوزن</span></div>
<div class="grid-2">
<div class="input-box"><label>الوزن الهدف (كغ)</label><input type="number" id="wt-target" value="90" oninput="calcWeightFormulas()"></div>
<div class="input-box"><label>العمر</label><input type="number" id="wt-age" value="25" oninput="calcWeightFormulas()"></div>
</div>
<div class="grid-2">
<div class="input-box"><label>الطول (سم)</label><input type="number" id="wt-height" value="170" oninput="calcWeightFormulas()"></div>
<div class="input-box">
<label>النشاط</label>
<select id="wt-activity" onchange="calcWeightFormulas()">
<option value="1.2">خامل</option>
<option value="1.375">خفيف</option>
<option value="1.55" selected>متوسط</option>
<option value="1.725">عالي</option>
</select>
</div>
</div>
</div>

<div class="grid-2">
<div class="box-item"><div class="box-title">مؤشر كتلة الجسم (BMI)</div><div class="box-val" id="res-bmi" style="color:var(--primary-blue);">--</div></div>
<div class="box-item"><div class="box-title">الأيض الأساسي (BMR)</div><div class="box-val" id="res-bmr" style="color:var(--green-in);">-- سعرة</div></div>
</div>

<div class="grid-2">
<div class="box-item"><div class="box-title">الاحتياج اليومي (TDEE)</div><div class="box-val" id="res-tdee" style="color:var(--orange-btn);">-- سعرة</div></div>
<div class="box-item"><div class="box-title">سعرات الوزن الكلية ()</div><div class="box-val" id="res-tot-cal" style="color:var(--red-out);">-- سعرة</div></div>
</div>

<div class="card" style="text-align:center; background:#eff6ff; border:1px solid #bfdbfe;">
<div class="box-title" style="font-size:12px; color:#1e40af;">الأسابيع المتبقية (بمعدل 1.5 كغ أسبوعياً)</div>
<div style="font-size:22px; font-weight:800; color:#2563eb; margin-top:4px;" id="res-weeks">-- أسبوع</div>
</div>
</div>

<!-- PAGE 4: REPORTS -->
<div class="page-view" id="page-reports">
<div class="card">
<div class="card-title" style="justify-content: space-between; align-items: center; margin-bottom:10px;">
<span><i class="fa-solid fa-chart-pie" style="color:var(--purple-reports);"></i> التقارير والتحليلات الشاملة</span>
<select id="report-filter" onchange="onReportFilterChange()" style="padding:4px 8px; border-radius:8px; border:1px solid #cbd5e1; font-size:11px; outline:none;">
<option value="all">كل الأوقات</option>
<option value="day">تحديد يوم محدد</option>
<option value="month">تحديد شهر محدد</option>
<option value="year">تحديد سنة محددة</option>
</select>
</div>

<div id="time-picker-container" style="margin-bottom: 10px; display: none;"></div>

<div class="grid-2" style="margin-top:10px;">
<div class="box-item">
<div class="box-title">إجمالي المدخول (أكل)</div>
<div class="box-val" style="color:var(--green-in);" id="rep-inc">0 سعرة</div>
</div>
<div class="box-item">
<div class="box-title">إجمالي المصروف (رياضة)</div>
<div class="box-val" style="color:var(--red-out);" id="rep-exp">0 سعرة</div>
</div>
</div>

<div class="grid-2">
<div class="box-item" style="background:#f8fafc; padding:12px;">
<div class="box-title">صافي السعرات (مدخول - مصروف)</div>
<div class="box-val" style="font-size:16px; color:var(--primary-blue); margin-top:4px;" id="rep-net">0 سعرة</div>
</div>
<div class="box-item" style="background:#fffbeb; padding:12px;">
<div class="box-title">سجل الوزن (الفترة المحددة)</div>
<div class="box-val" style="font-size:16px; color:var(--orange-btn); margin-top:4px;" id="rep-wt-diff">0 كغ</div>
</div>
</div>

<div class="chart-container">
<div class="card-title" style="margin-bottom:8px;">مقارنة الأداء الرسومية (الشارتات)</div>

<div class="chart-bar-wrap">
<div class="chart-label"><span>المدخول (أكل)</span><span id="chart-inc-lbl">0%</span></div>
<div class="chart-track"><div class="chart-fill" id="chart-inc-fill" style="width:0%; background:var(--green-in);"></div></div>
</div>

<div class="chart-bar-wrap">
<div class="chart-label"><span>المصروف (رياضة)</span><span id="chart-exp-lbl">0%</span></div>
<div class="chart-track"><div class="chart-fill" id="chart-exp-fill" style="width:0%; background:var(--red-out);"></div></div>
</div>
</div>

</div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
<button class="nav-btn debts" onclick="openActionForm('balance')"><i class="fa-solid fa-wallet"></i>رصيد</button>
<button class="nav-btn inc" onclick="openActionForm('income')"><i class="fa-solid fa-plus"></i>مدخول</button>
<button class="nav-btn exp" onclick="openActionForm('expense')"><i class="fa-solid fa-minus"></i>مصروف</button>
<button class="nav-btn txs" onclick="switchMainPage('txs')"><i class="fa-solid fa-list-check"></i>العمليات</button>
<button class="nav-btn rep" onclick="switchMainPage('rep')"><i class="fa-solid fa-chart-pie"></i>التقارير</button>
<button class="nav-btn hom" onclick="switchMainPage('cal')"><i class="fa-solid fa-house"></i>الرئيسية</button>
</div>

</div>

<!-- Modal Popup Layer -->
<div class="modal-overlay" id="form-modal">
<div class="modal-content" id="modal-body"></div>
</div>

<script>
let foodsDB = [
{ name: "خيار", cal: 15, p: 0.7, c: 3.6, f: 0.1 },
